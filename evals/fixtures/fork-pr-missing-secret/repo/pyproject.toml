[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "acme-sdk"
version = "2.4.0"
description = "Python client for the Acme API"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = [
  "httpx>=0.27,<1",
  "pydantic>=2.7,<3",
]

[project.optional-dependencies]
test = ["pytest>=8.3", "pytest-cov>=6.0", "respx>=0.22"]
dev = ["acme-sdk[test]", "ruff>=0.13", "mypy>=1.18"]

[tool.hatch.build.targets.wheel]
packages = ["src/acme_sdk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
branch = true
source = ["acme_sdk"]

[tool.ruff]
line-length = 100
target-version = "py310"
