name: Images

on:
  pull_request:
    paths:
      - "docker/**"
      - "requirements*.txt"
      - "src/**"
      - ".github/workflows/images.yml"
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/example-org/vision-models

jobs:
  lint:
    name: Lint Dockerfiles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hadolint/hadolint-action@v3.1.0
        with:
          recursive: true
          dockerfile: "*.Dockerfile"
          failure-threshold: error

  build:
    name: build (${{ matrix.variant }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: [cpu, cuda]
    steps:
      - uses: actions/checkout@v4

      - name: Runner resources
        run: |
          echo "cpus: $(nproc)"
          free -h
          df -h
          docker system df

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build ${{ matrix.variant }} image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/${{ matrix.variant }}.Dockerfile
          push: ${{ github.event_name == 'push' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: ${{ env.IMAGE }}:${{ matrix.variant }}-${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.variant }}
          cache-to: type=gha,scope=${{ matrix.variant }},mode=max

      - name: Image size report
        if: github.event_name == 'pull_request'
        run: |
          docker image ls ${{ env.IMAGE }}
          docker history --human ${{ env.IMAGE }}:${{ matrix.variant }}-${{ github.sha }} | head -n 20

  publish:
    name: Publish manifest
    needs: [lint, build]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag latest
        run: |
          for v in cpu cuda; do
            docker buildx imagetools create -t "$IMAGE:$v-latest" "$IMAGE:$v-${{ github.sha }}"
          done
