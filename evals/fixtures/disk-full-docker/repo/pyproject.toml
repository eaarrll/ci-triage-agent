[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "vision-models"
version = "0.9.0"
description = "Object detection models and the HTTP inference server"
requires-python = ">=3.12"

[project.scripts]
vision-serve = "vision_models.serve:main"

[tool.setuptools.packages.find]
where = ["src"]
