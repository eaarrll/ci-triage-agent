name: jobs-ci

on:
  pull_request:
    paths:
      - "jobs/**"
  push:
    branches: [main]
    paths:
      - "jobs/**"

permissions:
  contents: read

jobs:
  test:
    name: Test jobs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r jobs/requirements.txt pytest
      - run: pytest jobs -q
