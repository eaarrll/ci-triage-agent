name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: eu-west-1
  ECR_REPOSITORY: orders-api
  DEPLOY_ROLE_ARN: arn:aws:iam::123456789012:role/gha-deploy

jobs:
  test:
    name: Test
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: services/orders-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/orders-api/requirements*.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: pytest -q

  image:
    name: Build and push image
    needs: test
    runs-on: ubuntu-24.04
    outputs:
      image: ${{ steps.ref.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - uses: docker/setup-buildx-action@v3
      - id: ref
        run: echo "image=${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: services/orders-api
          push: true
          tags: ${{ steps.ref.outputs.image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  terraform:
    name: Terraform apply
    needs: image
    runs-on: ubuntu-24.04
    environment: production
    concurrency:
      group: terraform-production
      cancel-in-progress: false
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.13.5
          terraform_wrapper: false
      - run: terraform init -input=false
      - name: terraform apply
        run: terraform apply -input=false -auto-approve -var "image=${{ needs.image.outputs.image }}"

  smoke:
    name: Smoke test
    needs: terraform
    runs-on: ubuntu-24.04
    steps:
      - name: Wait for a healthy deployment
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error https://orders.example.com/healthz; then
              exit 0
            fi
            sleep 10
          done
          exit 1
