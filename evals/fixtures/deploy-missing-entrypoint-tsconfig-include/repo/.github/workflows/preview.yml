name: Preview

on:
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci
      - run: npm test

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci
      - name: Build
        run: npm run build
      - name: Report build output
        run: |
          du -sh dist
          find dist -name '*.js' | sort
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 3

  deploy-preview:
    needs: [test, build]
    runs-on: ubuntu-latest
    environment: preview
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build image
        run: docker buildx build --load -t ghcr.io/example-org/orders-api:pr-${{ github.event.number }} .
      - name: Smoke test image
        run: ./scripts/smoke-test.sh ghcr.io/example-org/orders-api:pr-${{ github.event.number }}
      - name: Push and deploy preview
        run: |
          docker push ghcr.io/example-org/orders-api:pr-${{ github.event.number }}
          ./scripts/deploy-preview.sh ${{ github.event.number }}
