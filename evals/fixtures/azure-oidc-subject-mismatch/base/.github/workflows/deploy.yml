name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  REGISTRY: crpaymentsprod.azurecr.io
  IMAGE_NAME: payments-api
  RESOURCE_GROUP: rg-payments-prod
  CONTAINER_APP: ca-payments-api

jobs:
  build:
    name: Build & test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - run: dotnet restore
      - run: dotnet build --no-restore --configuration Release
      - run: dotnet test --no-build --configuration Release --logger "trx;LogFileName=test-results.trx"

  deploy:
    name: Deploy to production
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Log in to ACR
        run: az acr login --name "${REGISTRY%%.*}"
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/Payments.Api/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Deploy revision
        run: |
          az containerapp update \
            --name "$CONTAINER_APP" \
            --resource-group "$RESOURCE_GROUP" \
            --image "$REGISTRY/$IMAGE_NAME:$GITHUB_SHA" \
            --revision-suffix "${GITHUB_SHA::7}"

  smoke:
    name: Smoke test
    needs: deploy
    runs-on: ubuntu-24.04
    steps:
      - name: Health check
        run: curl --fail --silent --show-error --retry 10 --retry-delay 6 --retry-all-errors https://payments.example.com/healthz
