name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      BANK_API_URL: https://sandbox.bankapi.example.com
      BANK_API_KEY: ${{ secrets.BANK_SANDBOX_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Unit tests
        run: pytest tests/unit
      - name: Sandbox integration tests
        run: pytest tests/integration -v
