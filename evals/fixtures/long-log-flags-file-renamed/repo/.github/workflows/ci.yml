name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - uses: golangci/golangci-lint-action@v8
        with: { version: v2.6 }

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - run: go test -short -race ./...

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: checkout
          POSTGRES_PASSWORD: checkout
          POSTGRES_DB: checkout_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U checkout"
          --health-interval 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://checkout:checkout@localhost:5432/checkout_test?sslmode=disable
      FEATURE_FLAGS_FILE: config/flags.test.yaml
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - name: Migrate
        run: go run ./cmd/migrate up
      - name: Integration tests
        run: go test -v -race -count=1 -tags=integration ./internal/... ./test/...
