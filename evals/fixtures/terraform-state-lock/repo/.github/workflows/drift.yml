name: drift

on:
  schedule:
    - cron: "17 2 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  issues: write

env:
  TF_IN_AUTOMATION: "true"
  ARM_USE_OIDC: "true"
  ARM_CLIENT_ID: ${{ vars.ARM_CLIENT_ID }}
  ARM_TENANT_ID: ${{ vars.ARM_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ vars.ARM_SUBSCRIPTION_ID }}

jobs:
  detect:
    name: Drift (${{ matrix.environment }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        environment: [staging, prod]
    defaults:
      run:
        working-directory: envs/${{ matrix.environment }}
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.ARM_CLIENT_ID }}
          tenant-id: ${{ vars.ARM_TENANT_ID }}
          subscription-id: ${{ vars.ARM_SUBSCRIPTION_ID }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.13.5
          terraform_wrapper: false
      - run: terraform init -input=false
      - name: terraform plan -detailed-exitcode
        id: plan
        run: |
          set +e
          terraform plan -input=false -lock=false -detailed-exitcode -no-color > plan.txt
          echo "exitcode=$?" >> "$GITHUB_OUTPUT"
      - name: Open drift issue
        if: steps.plan.outputs.exitcode == '2'
        uses: actions/github-script@v7
        env:
          ENVIRONMENT: ${{ matrix.environment }}
        with:
          script: |
            const fs = require("node:fs");
            const plan = fs.readFileSync(`envs/${process.env.ENVIRONMENT}/plan.txt`, "utf8");
            await github.rest.issues.create({
              ...context.repo,
              title: `Drift detected in ${process.env.ENVIRONMENT}`,
              labels: ["drift"],
              body: "```\n" + plan.slice(-60000) + "\n```",
            });
      - name: Fail on plan error
        if: steps.plan.outputs.exitcode == '1'
        run: exit 1
