name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  FX_FEED_URL: https://fx-feed.example.org/v1/reference.json

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy tax_engine

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
      - name: Refresh FX reference rates
        run: python scripts/refresh_fx.py --out tests/data/fx_reference.json
      - name: Run tests
        env:
          FORCE_COLOR: "1"
        run: pytest --cov=tax_engine --cov-report=term-missing:skip-covered --junitxml=reports/junit.xml
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit
          path: reports/junit.xml
      - name: Doctests
        run: pytest --no-cov --doctest-glob="*.md" docs/

  build:
    name: build
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pipx run build
      - run: pipx run twine check dist/*
